crawler:
  enabled: true
  crawl_interval_secs: 30
  max_nodes: 1000
  max_infohashes: 100000
  listen_port: 6882
  persistence_path: "target/dht_routing_table.json"

storage:
  path: "target/data/pdc.db"
  enabled: true

nat:
  enabled: true
  lease_duration: 3600

super_tracker:
  interval: 30
  min_interval: 0

federation:
  enabled: true
  listen_port: 6885
  seed_nodes:
    - "192.168.30.51:6885"
  target_neighbors: 8
  max_connections: 32
  heartbeat_interval_secs: 30
  enable_relay: true
  nat_mapping_enabled: true