name: Compliance Check

on:
  pull_request:
    branches: [main]

jobs:
  compliance:
    name: Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4
        with:
          path: PeerDiscoveryCenter

      - name: Checkout PandaNetOS 标准库
        uses: actions/checkout@v4
        with:
          repository: PandaNetOS/PandaNetOS
          path: PandaNetOS

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            PeerDiscoveryCenter

      - name: 运行 PandaNetOS 合规检查
        run: bash PandaNetOS/scripts/check_compliance.sh PeerDiscoveryCenter

      - name: 上传检查日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-log
          path: |
            PeerDiscoveryCenter/**/Cargo.toml
            PeerDiscoveryCenter/README.md
          retention-days: 7
