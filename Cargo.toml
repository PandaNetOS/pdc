[package]
name = "PeerDiscoveryCenter"
version = "0.2.0"
edition = "2021"
description = "缁熶竴鐨?BitTorrent Peer 鍙戠幇涓績锛氫簨浠堕┍鍔?+ 鎺у埗闈?鏁版嵁闈㈠垎绂?+ 鎻掍欢鍖栧彂鐜板櫒 + 瓒呯骇 Tracker"
license = "MIT"

[[bin]]
name = "pdc"
path = "src/main.rs"

[lib]
name = "PeerDiscoveryCenter"
path = "src/lib.rs"

[dependencies]
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_bencode = "0.2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "trust-dns", "gzip"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
url = "2"
rand = "0.8"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
futures = "0.3"
igd = "0.12"
prometheus = "0.13"
rusqlite = { version = "0.31", features = ["bundled"] }
hickory-resolver = "0.24"
rustc-hash = "2"
crossbeam = "0.8"
bincode = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
lru = "0.12"
bytes = "1"
serde-big-array = "0.5"
socket2 = "0.6"
pnos = { path = "../pnos-spec" }
pnos-net = { path = "../pnos-sdk/crates/pnos-net" }

[dev-dependencies]
tokio-test = "0.4"
