[package]
name = "PeerDiscoveryCenter"
version = "0.2.0"
edition = "2021"
description = "统一的 BitTorrent Peer 发现中心：事件驱动 + 控制面/数据面分离 + 插件化发现器 + 超级 Tracker"
license = "MIT"

[[bin]]
name = "pdc"
path = "src/main.rs"

[lib]
name = "PeerDiscoveryCenter"
path = "src/lib.rs"

[dependencies]
pandanetos = { path = "../PandaNetOS/crates/pandanetos" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_bencode = "0.2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
url = "2"
rand = "0.8"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
futures = "0.3"
igd = "0.12"
prometheus = "0.13"
rusqlite = { version = "0.31", features = ["bundled"] }
hickory-resolver = "0.24"

[dev-dependencies]
tokio-test = "0.4"
