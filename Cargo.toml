[package]
name = "PeerDiscoveryCenter"
version = "0.1.0"
edition = "2021"
description = "统一的 BitTorrent Peer 发现中心：Tracker + DHT + PEX 三合一"
license = "MIT"

[dependencies]
pandanetos = { path = "../PandaNetOS/crates/pandanetos" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
rand = "0.8"
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
