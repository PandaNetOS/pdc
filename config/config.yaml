# ============================================================
# 冷热分层内存限制（2026-09-29 统一调至 2000MB）
# tier.memory_limit_mb 为全局内存硬限制（默认 1024），达到阈值触发紧急驱逐防 OOM。
# 其余 tier 字段（hot_max_count/warm_max_count 等）走代码默认。
# ============================================================
tier:
  memory_limit_mb: 2000

# ===== 配置热重载（2026-09-29 落地）=====
# 以下键均有代码内默认值，此处仅作参考；与默认值一致时无需取消注释。
# 热更新间隔 config_reload_interval_secs 已在上方（30 秒，0=禁用）。
# 分类：crawler.rate_limit_* / log_level / super_tracker.*（除端口）→ 热生效；
#       task_scheduler.* → 调度器热生效；端口/socket_count/runtime 线程数 → 需重启。
# crawler:
#   rate_limit_enter_threshold: 0.15   # 进入限速阈值（响应率低于此值）
#   rate_limit_exit_threshold: 0.30    # 解除限速阈值
#   rate_limit_min_samples: 50         # 限速判断最小样本数
#   rate_limit_throttle_skip_ratio: 0.5 # 限速时降频跳过比例
# config_reload_debounce_ms: 1000      # 检测到文件变化后的防抖等待（毫秒）
# 手动立即重载: POST /api/v1/config/reload （API token 鉴权继承）
