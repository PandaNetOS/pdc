server:
  listen: 0.0.0.0
  port: 6880
  api_port: 6886
  token: null
super_tracker:
  enabled: true
  interval: 1800
  min_interval: 900
  max_numwant: 100
  peer_ttl_secs: 3600
  trigger_backend_discovery: true
  udp_port: null
  relay_port: 6881
discoverers:
  enable_tracker: true
  enable_dht: true
  enable_pex: true
  enable_lpd: false
  enable_webseed: false
  discovery_timeout_secs: 30
  max_concurrent: 10
  custom_trackers: []
  enable_remote_tracker: true
  remote_tracker_url: https://cdn.jsdelivr.net/gh/adysec/tracker@main/trackers_best.txt
  dht_listen_port: 6881
  lpd_multicast_port: 6771
cache:
  peer_ttl_secs: 86400
  max_peers_per_discovery: 200
health_check:
  interval_secs: 300
  cache_cleanup_interval_secs: 600
  stats_output_interval_secs: 300
crawler:
  enabled: true
  max_infohashes: 100000
  listen_port: 6882
  socket_count: 8
  utp_port: 6883
  tcp_pex_port: 6884
  bootstrap_nodes:
  - - router.bittorrent.com
    - 6881
  - - dht.transmissionbt.com
    - 6881
  - - router.utorrent.com
    - 6881
  - - dht.aelitis.com
    - 6881
  - - router.bitcomet.com
    - 6881
  - - dht.libtorrent.org
    - 25401
  - - dht.aria2.net
    - 6881
  - - router.magnet2torrent.com
    - 6881
  - - dht.download.free.fr
    - 6881
  - - dht.cdnbye.com
    - 6881
  - - dht.pps001.cn
    - 6881
  - - tracker1.itzmx.com
    - 6881
nat:
  enabled: true
  lease_duration: 3600
  # v10(G)：IP 直列绕过 DNS 失败（域名 STUN 在现场解析失败导致 NAT 误判）
  stun_servers:
  - 111.206.174.3:3478
  - 106.12.71.140:3478
  - 124.222.49.56:3478
  - 162.159.207.0:3478
  enable_reachability_check: true
storage:
  path: ./data/pdc.db
  enabled: true
persistence:
  batch_size: 500
federation:
  enabled: true
  node_id: null
  seed_nodes: []
  listen_port: 6885
  api_port: 6880
  lpd_multicast_port: 6772
  max_connections: 32
  target_neighbors: 8
  heartbeat_timeout_secs: 90
  nat_mapping_enabled: true
  # v10(G)：同上，国内可达 IP 直列（.51 实测 nat_type=Symmetric 判定成功）
  stun_servers:
  - 111.206.174.3:3478
  - 106.12.71.140:3478
  - 124.222.49.56:3478
  - 162.159.207.0:3478
  enable_relay: true
  relay_bandwidth_limit_mbps: 10
  relay_max_connections: 5
  relay_auto_setup_on_connect: true
  gossip_interval_ms: 1000
  gossip_fanout: 3
  gossip_seen_shards: 16
  sync_peer_enabled: true
  sync_node_enabled: true
  sync_infohash_enabled: true
  sync_tracker_enabled: true
  dht_discovery_enabled: true
  dht_discovery_interval_secs: 300
  peer_cache_enabled: true
  peer_cache_max_nodes: 100
  transport_write_timeout_secs: 5
  gossip_max_consecutive_failures: 3
  reconnect_cooldown_secs: 30
  heavy_task_max_concurrency: 8
  gossip_max_bytes_per_second: 5242880
  gossip_max_messages_per_second: 100
  receive_pending_threshold: 1000
  initial_sync_batch_size: 5000
  gossip_flush_max_batches: 10
  full_sync_batch_size: 5000
  full_sync_window_size: 3
  full_sync_gossip_max_messages_per_second: 5000
  full_sync_gossip_max_bytes_per_second: 52428800
  gossip_bulk_max_batches: 50
  gossip_bulk_max_bytes: 2097152
  parallel_propagation: true
  full_sync_receiving_settle_ms: 60000
log_level: info
port_auto_alloc: true
port_step: 10
auto_firewall_rule: true

# ===== A 批自适应 IO（2026-09-28 事故整改）=====
