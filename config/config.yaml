#   checkpoint_tick_ms: 1000             # 决策 tick 间隔（O(1)，只读原子量+WAL 尺寸）
#   checkpoint_min_interval_secs: 5      # 两次 checkpoint 最小间隔
#   checkpoint_wal_soft_mb: 32          # WAL 软阈值，达到才允许触发
